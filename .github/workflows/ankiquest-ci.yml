# The flake check and a build in the Nix dev shell on every pull request and on
# master. Gradle build, lint and tests are upstream's ci.yml.
# The jobs are AnkiQuest-Dev's shared android-ci workflow.
name: ankiquest CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

permissions:
  contents: read

# A newer push to a pull request replaces its run; pushes to master and merge
# queue entries each keep theirs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything besides documentation changed; a docs-only change skips
  # the build. Markdown counts as docs only outside app/: the app bundles
  # app/src/main/resources/.../twenty_rules_content.md and its tests read it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # code-changed lists the pull request's files
    outputs:
      code: ${{ steps.changed.outputs.code }}
    steps:
      - id: changed
        uses: AnkiQuest/AnkiQuest-Dev/.github/actions/code-changed@5ab685e7013b865630f96530ca8c654344738fa8
        with:
          docs: |
            *.md
            docs/**
            distribution/**/*.md
            LICENSE*
            LICENSES/**
            .github/ISSUE_TEMPLATE/**
            .github/pull_request_template.md

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/android-ci.yml@master
    with:
      jobs: nix
