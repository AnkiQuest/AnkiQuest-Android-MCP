# SPDX-License-Identifier: AGPL-3.0-or-later
# The flake check and a build in the Nix dev shell on every pull request and on
# master. Gradle build, lint and tests are upstream's ci.yml.
# The jobs are AnkiQuest-Dev's shared android-ci workflow.
name: ankiquest CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  ci:
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/android-ci.yml@master
    with:
      jobs: nix
